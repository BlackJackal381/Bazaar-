<!doctype html>
<!--
  Bazaar Flips: a live Hypixel SkyBlock Bazaar flip finder.
  Pulls public data straight from api.hypixel.net (no API key needed).
  Host it anywhere that serves static files (GitHub Pages, a home server, etc.).
  Settings and tracked items are saved in this browser only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flips">
<meta name="theme-color" content="#120b1f">
<title>Bazaar Flips</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120b1f;
    --panel: #1a1130;
    --edge: #3b1f7a;
    --edge-outer: #07030f;
    --field: #110a20;
    --text: #ece8f5;
    --muted: #a69dbf;
    --gold: #ffb52a;
    --gold-shadow: #3d2800;
    --green: #5fe56f;
    --red: #ff6b6b;
    --aqua: #68e8f0;
    --pixel: "Pixelify Sans", "Courier New", monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f0f9;
      --panel: #ffffff;
      --edge: #c9b8ef;
      --edge-outer: #e2d9f4;
      --field: #f7f4fc;
      --text: #1d1530;
      --muted: #5e5577;
      --gold: #9b5c00;
      --gold-shadow: rgba(155, 92, 0, .16);
      --green: #17853a;
      --red: #c4302b;
      --aqua: #0b7c86;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.45 var(--sans);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 14px 40px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 {
    margin: 0;
    font: 700 30px/1 var(--pixel);
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--gold-shadow);
  }
  .status { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .btn {
    font: 600 14px var(--sans);
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 4px;
    padding: 8px 14px;
    min-height: 42px;
    cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  :is(.btn, .tab, .segbtn, .remove, input, select, summary):focus-visible {
    outline: 2px solid var(--aqua);
    outline-offset: 2px;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin: 18px 0 10px;
    padding: 4px;
    background: var(--edge-outer);
    border-radius: 6px;
  }
  .tab {
    font: 600 14px var(--sans);
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 4px;
    min-height: 42px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--panel);
    box-shadow: inset 0 0 0 2px var(--edge);
  }

  details.settings { margin: 0 0 6px; }
  details.settings summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 2px;
    width: fit-content;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px;
    margin-top: 4px;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 4px;
  }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; color: var(--text); font-size: 14px; }
  select, input:not([type="checkbox"]) {
    font: 500 15px var(--sans);
    color: var(--text);
    background: var(--field);
    border: 2px solid var(--edge);
    border-radius: 4px;
    padding: 8px 10px;
    min-height: 42px;
    width: 100%;
  }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }

  .intro { margin: 12px 2px; font-size: 14px; color: var(--muted); }
  .empty { margin: 16px 2px; color: var(--muted); }
  .notice {
    margin: 12px 0;
    padding: 10px 12px;
    border-left: 3px solid var(--red);
    background: var(--panel);
    border-radius: 2px;
  }

  .seg { display: inline-flex; gap: 4px; padding: 4px; margin-top: 4px; background: var(--edge-outer); border-radius: 6px; }
  .segbtn {
    font: 600 13px var(--sans);
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 0 14px;
    min-height: 36px;
    cursor: pointer;
  }
  .segbtn[aria-pressed="true"] { color: var(--text); background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge); }

  ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .row {
    padding: 12px 14px;
    background: var(--panel);
    border: 2px solid var(--edge-outer);
    box-shadow: inset 0 0 0 2px var(--edge);
    border-radius: 3px;
  }
  .row-head { display: flex; align-items: baseline; gap: 10px; }
  .rank { min-width: 1.3em; font: 500 15px var(--pixel); color: var(--muted); }
  .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .hr { white-space: nowrap; font: 700 19px var(--pixel); color: var(--green); }
  .hr small { margin-left: 2px; font: 500 12px var(--sans); color: var(--muted); }
  .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 6px; }
  .pair > div { padding: 6px 10px; background: var(--field); border-radius: 3px; }
  .pair dt { font-size: 12px; color: var(--muted); }
  .pair dd { margin: 0; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stats { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warn { color: var(--red); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .remove {
    font: 500 13px var(--sans);
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 6px 4px;
    cursor: pointer;
    text-decoration: underline;
  }

  .addform {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
    padding: 12px;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 4px;
  }
  .full { grid-column: 1 / -1; }
  .formerr { margin: 0; color: var(--red); font-size: 13px; }
  .formerr:empty { display: none; }

  footer { margin-top: 22px; font-size: 12px; color: var(--muted); }

  @media (max-width: 360px) {
    .settings-grid, .addform, .pair { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Bazaar Flips</h1>
      <p class="status" id="status" aria-live="polite">Loading prices…</p>
    </div>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-tab="flips" aria-selected="true">Flips</button>
    <button class="tab" role="tab" data-tab="crafts" aria-selected="false">Crafts</button>
    <button class="tab" role="tab" data-tab="npc" aria-selected="false">NPC</button>
    <button class="tab" role="tab" data-tab="watch" aria-selected="false">Holding</button>
  </nav>

  <details class="settings">
    <summary>Settings</summary>
    <div class="settings-grid">
      <label>Bazaar tax
        <select id="set-tax">
          <option value="1.25">1.25% (default)</option>
          <option value="1.125">1.125%</option>
          <option value="1">1%</option>
        </select>
      </label>
      <label>Min trades per week
        <select id="set-minvol">
          <option value="1000">1,000</option>
          <option value="5000">5,000</option>
          <option value="10000">10,000</option>
          <option value="50000">50,000</option>
          <option value="100000">100,000</option>
        </select>
      </label>
      <label class="full">Your share of each item's trades
        <select id="set-share">
          <option value="2">2%, very crowded items</option>
          <option value="5">5%, typical</option>
          <option value="10">10%, quiet items</option>
          <option value="25">25%, optimistic</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="set-suspicious"> Show items with suspiciously wide spreads</label>
    </div>
  </details>

  <main id="view"></main>
  <datalist id="itemlist"></datalist>

  <footer id="foot"></footer>
</div>

<script>
(() => {

  // Single-ingredient compaction recipes: [output, input, amount]

  ];

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const DEFAULTS = { tax: 1.25, minVol: 5000, share: 5, craftMode: "orders", suspicious: false };
  const settings = Object.assign({}, DEFAULTS, store.get("bf_settings", {}));
  let positions = store.get("bf_positions", null);
  if (!Array.isArray(positions)) positions = [{ id: "ENCHANTED_GOLD_BLOCK", qty: 320, cost: 76860.4 }];
  const saveSettings = () => store.set("bf_settings", settings);
  const savePositions = () => store.set("bf_positions", positions);

  // ---------- state ----------
  let products = {};
  let names = {};
  let npcPrices = {};
  let itemsLoaded = false;
  let lastUpdated = 0;
  let loading = false;
  let errorMsg = "";
  let tab = store.get("bf_tab", "flips");
  let datalistCount = -1;

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf1 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });
  const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const coins = (n) => nf1.format(n);
  const r1 = (n) => Math.round(n * 10) / 10;
  const pct = (n) => (n * 100).toFixed(2) + "%";
  function short(n) {
    const a = Math.abs(n), s = n < 0 ? "−" : "";
    if (a >= 1e9) return s + (a / 1e9).toFixed(2) + "B";
    if (a >= 1e6) return s + (a / 1e6).toFixed(2) + "M";
    if (a >= 1e3) return s + (a / 1e3).toFixed(1) + "k";
    return s + (a < 10 ? a.toFixed(1) : a.toFixed(0));
  }
  const signed = (n) => (n >= 0 ? "+" : "") + short(n);
  const taxKeep = () => 1 - settings.tax / 100;

  function prettify(id) {
    return id.replace(/:/g, " ").split("_").filter(Boolean)
      .map((w) => w.charAt(0) + w.slice(1).toLowerCase()).join(" ");
  }
  const nameOf = (id) => names[id] || prettify(id);

  // Best prices in the order book.
  // sell_summary = buy orders (what insta-sell hits), buy_summary = sell offers (what insta-buy hits).
  function book(p) {
    const bids = (p.sell_summary || []).map((o) => o.pricePerUnit);
    const asks = (p.buy_summary || []).map((o) => o.pricePerUnit);
    return {
      bid: bids.length ? Math.max(...bids) : null,
      ask: asks.length ? Math.min(...asks) : null
    };
  }

      const data = await res.json();
      if (data.success === fal
